<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080">
<title>ICL S2 Logo Launch</title>
<!--
  Signal poster (Season 2 moodboard: night, launch, finals).
  Navy ground, electric-blue giant numeral, red accents, scanlines,
  and a red/blue channel split on the single-colour white lockup.
  Canvas 1080 x 1350 (4:5). Export: node render.js
-->
<style>
@font-face{font-family:'Archivo';src:url(assets/fonts/Archivo.woff2) format('woff2');font-style:normal;font-weight:100 900;font-stretch:62% 125%;font-display:block}
@font-face{font-family:'Archivo';src:url(assets/fonts/Archivo-Italic.woff2) format('woff2');font-style:italic;font-weight:100 900;font-stretch:62% 125%;font-display:block}
@font-face{font-family:'Instrument Serif';src:url(assets/fonts/InstrumentSerif.woff2) format('woff2');font-style:normal;font-weight:400;font-display:block}
@font-face{font-family:'Instrument Serif';src:url(assets/fonts/InstrumentSerif-Italic.woff2) format('woff2');font-style:italic;font-weight:400;font-display:block}
@font-face{font-family:'JetBrains Mono';src:url(assets/fonts/JetBrainsMono.woff2) format('woff2');font-style:normal;font-weight:100 800;font-display:block}

:root{
  --crease:#F5F3EE; --ink:#0B0C14;
  --red:#E92D3C; --blue:#1234F9; --navy:#061433; --white:#FFFFFF;
  --f-display:'Archivo','Arial Narrow',Arial,sans-serif;
  --f-serif:'Instrument Serif',Georgia,serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:#000}
.poster{position:relative;width:1080px;height:1350px;overflow:hidden;background:var(--navy);color:var(--white)}
.poster > *{position:absolute;margin:0}

/* ground: blue bloom behind the lockup, red heat at the base */
.glow{inset:0;background:
  radial-gradient(ellipse 620px 520px at 540px 520px,rgba(18,52,249,.55),rgba(18,52,249,0) 70%),
  radial-gradient(ellipse 900px 360px at 540px 1420px,rgba(233,45,60,.38),rgba(233,45,60,0) 70%)}

/* giant numeral, behind the lockup */
.num{left:0;right:0;top:40px;text-align:center;font-family:var(--f-display);font-stretch:62%;font-weight:900;font-size:1040px;line-height:.8;letter-spacing:-.04em;color:var(--blue);font-variant-numeric:tabular-nums}

/* reveal beams fanning out from behind the lockup */
.beams{left:0;top:0;width:1080px;height:1350px}

/* broadcast scanlines over everything except the facts */
.scan{inset:0;background:repeating-linear-gradient(0deg,rgba(6,20,51,.38) 0 2px,rgba(6,20,51,0) 0 6px);pointer-events:none}

/* top row */
.meta{top:58px;font-family:var(--f-mono);font-weight:500;font-size:21px;letter-spacing:.14em;text-transform:uppercase;line-height:1.5}
.meta.l{left:64px}
.meta.r{right:64px;text-align:right}
.meta b{font-weight:700}

/* title partner */
.partner{left:0;right:0;top:186px;text-align:center;font-family:var(--f-display);font-style:italic;font-stretch:125%;font-weight:800;font-size:54px;letter-spacing:.02em;text-transform:uppercase;line-height:1}
.partner span{display:inline-block;width:.5em;height:.12em;margin:0 .18em;vertical-align:.3em;background:var(--white);transform:skewX(-14deg)}

/* lockup with red/blue channel split */
.logo{left:220px;top:268px;width:640px;height:538px}
.logo img{position:absolute;inset:0;width:100%;height:100%}
.logo .r{filter:url(#to-red);transform:translateX(-7px)}
.logo .b{filter:url(#to-blue);transform:translateX(7px)}
.logo .b,.logo .r{opacity:.9}

/* headline */
.tag{left:0;right:0;top:846px;text-align:center;font-family:var(--f-display);font-style:italic;font-stretch:125%;font-weight:800;font-size:40px;letter-spacing:.06em;text-transform:uppercase;color:var(--red)}
.head{left:0;right:0;top:894px;text-align:center;font-family:var(--f-display);font-stretch:62%;font-weight:900;font-size:178px;line-height:.84;text-transform:uppercase;letter-spacing:-.005em}

/* unveiled by */
.by-label{left:64px;right:64px;top:1062px;display:flex;align-items:center;gap:20px;font-family:var(--f-mono);font-weight:500;font-size:19px;letter-spacing:.14em;text-transform:uppercase}
.by-label::before,.by-label::after{content:"";flex:1;height:2px;background:currentColor;opacity:.35}
.by{left:64px;right:64px;top:1100px;display:grid;grid-template-columns:1fr 1fr;gap:40px;text-align:center}
.by h3{margin:0;font-family:var(--f-serif);font-weight:400;font-size:66px;line-height:1;letter-spacing:-.01em}
.by h3 em{font-style:italic}
.by p{margin:10px 0 0;font-family:var(--f-mono);font-weight:500;font-size:18px;letter-spacing:.12em;text-transform:uppercase;line-height:1.45;opacity:.85}

/* footer */
.foot{left:64px;right:64px;bottom:50px;display:flex;justify-content:space-between;border-top:2px solid currentColor;padding-top:16px;font-family:var(--f-mono);font-weight:500;font-size:19px;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="to-red" color-interpolation-filters="sRGB"><feColorMatrix values="0 0 0 0 0.914  0 0 0 0 0.176  0 0 0 0 0.235  0 0 0 1 0"/></filter>
  <filter id="to-blue" color-interpolation-filters="sRGB"><feColorMatrix values="0 0 0 0 0.071  0 0 0 0 0.204  0 0 0 0 0.976  0 0 0 1 0"/></filter>
</svg>

<main class="poster" role="img" aria-label="Official logo launch poster for EASYWAY-VIP Imama Cricket League Season 2, unveiled by Gafoor Patla and Jabir">
  <div class="glow"></div>
  <div class="num">02</div>

  <svg class="beams" viewBox="0 0 1080 1350" aria-hidden="true">
    <g fill="#FFFFFF" opacity=".07">
      <polygon points="540,540 -200,120 -200,300"/>
      <polygon points="540,540 1280,120 1280,300"/>
      <polygon points="540,540 -200,760 -200,900"/>
      <polygon points="540,540 1280,760 1280,900"/>
    </g>
  </svg>

  <div class="scan"></div>

  <div class="logo">
    <img class="r" src="assets/icl-s2-logo-white.svg" alt="">
    <img class="b" src="assets/icl-s2-logo-white.svg" alt="">
    <img class="w" src="assets/icl-s2-logo-white.svg" alt="UAE Imama, Imama Cricket League, Season 2">
  </div>

  <p class="meta l">UAE Imama<br><b>Presents</b></p>
  <p class="meta r">Season 02<br>UAE · 2026</p>

  <p class="partner">Easyway<span aria-hidden="true"></span>VIP</p>

  <p class="tag">Official</p>
  <h1 class="head">Logo launch</h1>

  <p class="by-label">Unveiled by</p>
  <div class="by">
    <div><h3><em>Gafoor</em> Patla</h3><p>CEO<br>Easyway &amp; VIP</p></div>
    <div><h3><em>Jabir</em></h3><p>Operations Manager<br>Easyway</p></div>
  </div>

  <div class="foot"><span>ICL</span><span>+</span><span>Season 02</span><span>+</span><span>Logo launch</span></div>
</main>
</body>
</html>
